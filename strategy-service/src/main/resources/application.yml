server:
  port: 8083
  error:
    include-message: always   # e.g. explain why an X-User value was rejected

spring:
  application:
    name: strategy-service
  task:
    scheduling:
      pool:
        size: 4        # the 1-second exit watcher must not wait behind the minute runner or other jobs
  datasource:
    # PostgreSQL: one database for all services; see README "Database (PostgreSQL)".
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trade_analysis}?reWriteBatchedInserts=true   # batches go as multi-row INSERTs
    username: ${DB_USER:trade}
    password: ${DB_PASSWORD:choose-a-password}
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false
    show-sql: false
  flyway:
    # Several services share one schema, so each keeps its own history table.
    table: flyway_history_strategy
    baseline-on-migrate: true
    baseline-version: 0

  # Email (SMTP). Leave MAIL_HOST unset to only log emails. Gmail: smtp.gmail.com:587 with an app password.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  cloud:
    openfeign:
      client:
        config:
          market-data-service:
            # First 1-minute backfill of a long range downloads and stores ~375 bars/day from Kite.
            read-timeout: 600000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Register a stable name instead of the Mac's hostname (macOS renames Mac-1.lan → Mac-3.lan etc.,
    # and the gateway then fails with "Failed to resolve 'mac-1.lan'"). Docker sets the service name.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_CHECK:false}   # true = /actuator/health checks the SMTP connection
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Trading (paper/live orders through Kite). Live trading is switched on or off by an admin on the Trading page.
trading:
  runner:
    enabled: ${TRADING_RUNNER_ENABLED:true}       # runs PAPER/LIVE strategies every minute in market hours
    cron: "3 * * * * *"                           # 3 s after each minute's close (IST): market-data treats a candle as final 2 s after its close
    max-entry-delay-minutes: 5                    # never enter a signal older than this (e.g. after a late start)
  exit-watch:
    interval-ms: 1000                             # open positions are checked against the live index price every second
    candle-every-ms: 3000                         # and against the forming 1-minute candle's high/low (catches sub-second touches)


# Login (see README "Login"). Leave AUTH_JWT_SECRET unset to use the random key kept in the auth_key table.
auth:
  jwt-secret: ${AUTH_JWT_SECRET:}
  token-hours: 8
  trust-user-header: false     # true = accept a bare X-User header (development only)
  auto-register-users: false

# Account emails (sign-up received, approved/rejected with remarks, payment received).
notifications:
  app-url: ${APP_URL:http://localhost:5173}     # links in emails point here (the UI)
  email:
    from: ${MAIL_FROM:}                          # e.g. "Trade Analysis <alerts@yourdomain.com>"; defaults to MAIL_USERNAME
    dispatch-ms: 15000

# Razorpay one-time plan payments (see README "Payments"). Unset keys = online payments off.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}             # rzp_test_... or rzp_live_...
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}   # set in Razorpay Dashboard → Webhooks
  plan-days: 30

# Users' own Kite Connect accounts (GOLD/PREMIUM). Secrets and tokens are stored encrypted with this key:
# base64 of 32 bytes (openssl rand -base64 32). Unset = a random key kept in table kite_account_key.
kite:
  encryption-key: ${KITE_ENCRYPTION_KEY:}

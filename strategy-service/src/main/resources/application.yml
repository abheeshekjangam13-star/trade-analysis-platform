server:
  port: 8083

spring:
  application:
    name: strategy-service
  datasource:
    url: jdbc:h2:file:./data/strategy;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

  cloud:
    openfeign:
      client:
        config:
          market-data-service:
            # First 1-minute backfill of a long range downloads and stores ~375 bars/day from Kite.
            read-timeout: 600000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Register a stable name instead of the Mac's hostname (macOS renames Mac-1.lan → Mac-3.lan etc.,
    # and the gateway then fails with "Failed to resolve 'mac-1.lan'"). Docker sets the service name.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

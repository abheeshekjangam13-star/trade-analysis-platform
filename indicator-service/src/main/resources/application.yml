server:
  port: 8082

spring:
  application:
    name: indicator-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Register a stable name instead of the Mac's hostname (macOS renames Mac-1.lan → Mac-3.lan etc.,
    # and the gateway then fails with "Failed to resolve 'mac-1.lan'"). Docker sets the service name.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

spring:
  application:
    name: api-gateway
  # Access log (table access_log, created by strategy-service's Flyway migrations).
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trade_analysis}
    username: ${DB_USER:trade}
    password: ${DB_PASSWORD:choose-a-password}
  cloud:
    gateway:
      server:
        webflux:
          # New services get a route here; lb:// resolves through Eureka.
          routes:
            - id: market-data-service
              uri: lb://market-data-service
              predicates:
                - Path=/api/market-data/**
            - id: indicator-service
              uri: lb://indicator-service
              predicates:
                - Path=/api/indicators/**
            - id: strategy-service
              uri: lb://strategy-service
              predicates:
                - Path=/api/auth/**, /api/strategies/**, /api/backtests/**, /api/nifty-trades/**, /api/portfolios/**, /api/users/**, /api/access-log/**, /api/trading/**, /api/notifications/**, /api/payments/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Register a stable name instead of the Mac's hostname (macOS renames Mac-1.lan → Mac-3.lan etc.,
    # and the gateway then fails with "Failed to resolve 'mac-1.lan'"). Docker sets the service name.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  health:
    r2dbc:
      enabled: false   # a database outage must not mark the gateway DOWN; access logging just pauses
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# Login: every /api call except /api/auth/{status,setup,login} needs a valid token (see README "Login").
auth:
  enabled: true                # false = development only: trust the client's X-User header
  jwt-secret: ${AUTH_JWT_SECRET:}

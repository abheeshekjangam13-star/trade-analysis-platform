server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # New services get a route here; lb:// resolves through Eureka.
          routes:
            - id: market-data-service
              uri: lb://market-data-service
              predicates:
                - Path=/api/market-data/**
            - id: indicator-service
              uri: lb://indicator-service
              predicates:
                - Path=/api/indicators/**
            - id: strategy-service
              uri: lb://strategy-service
              predicates:
                - Path=/api/strategies/**, /api/backtests/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

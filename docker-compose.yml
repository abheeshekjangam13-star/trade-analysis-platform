version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trade_analysis
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_analysis"]
      interval: 5s
      retries: 10

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery-server
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  market-data-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: market-data-service
    ports: ["8081:8081"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: market-data-service
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

  indicator-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: indicator-service
    ports: ["8082:8082"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: indicator-service
    depends_on:
      discovery-server:
        condition: service_healthy

  strategy-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: strategy-service
    ports: ["8083:8083"]
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: strategy-service
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      market-data-service:
        condition: service_started
      indicator-service:
        condition: service_started

volumes:
  pgdata:

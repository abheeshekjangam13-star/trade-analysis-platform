server:
  port: 8081

spring:
  application:
    name: market-data-service
  datasource:
    url: jdbc:h2:file:./data/market-data;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Register a stable name instead of the Mac's hostname (macOS renames Mac-1.lan → Mac-3.lan etc.,
    # and the gateway then fails with "Failed to resolve 'mac-1.lan'"). Docker sets the service name.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

market-data:
  refresh-ms: 300000

kite:
  api-key: ${KITE_API_KEY}
  api-secret: ${KITE_API_SECRET}
  access-token: ${KITE_ACCESS_TOKEN:}

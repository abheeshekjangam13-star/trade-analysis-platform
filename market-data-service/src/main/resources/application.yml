server:
  port: 8081

spring:
  application:
    name: market-data-service
  datasource:
    # PostgreSQL: one database for all services; see README "Database (PostgreSQL)".
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trade_analysis}
    username: ${DB_USER:trade}
    password: ${DB_PASSWORD:choose-a-password}
  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false
    show-sql: false
  flyway:
    # Several services share one schema, so each keeps its own history table.
    table: flyway_history_market_data
    baseline-on-migrate: true
    baseline-version: 0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Register a stable name instead of the Mac's hostname (macOS renames Mac-1.lan → Mac-3.lan etc.,
    # and the gateway then fails with "Failed to resolve 'mac-1.lan'"). Docker sets the service name.
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

market-data:
  refresh-ms: 300000

kite:
  api-key: ${KITE_API_KEY}
  api-secret: ${KITE_API_SECRET}
  access-token: ${KITE_ACCESS_TOKEN:}
